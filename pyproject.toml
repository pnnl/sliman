[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sliman"
version = "0.5.0"
description = "Description"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Dylan Ross", email = "dylan.ross@pnnl.gov"}
]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/PNNL-Compbio/sliman"
"Bug Tracker" = "https://github.com/PNNL-Compbio/sliman/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sliman"]